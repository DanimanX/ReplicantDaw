name: Release · Linux

on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: replicant-daw

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install audio and windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxi-dev \
            libudev-dev

      - name: Tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Engine self-test
        run: |
          REPLICANT_DAW_NO_AUDIO=1 ./target/release/${{ env.BIN_NAME }} --selftest

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="${BIN_NAME}-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG}"
          cp "target/release/${BIN_NAME}" "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          sha256sum "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Replicant DAW ${TAG#v}" --generate-notes || true
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/* --clobber; then
              exit 0
            fi
            sleep 5
          done
          exit 1
