name: Release · macOS

on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: replicant-daw

jobs:
  macos:
    name: macOS (arm64 + x86_64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with both Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Tests (native arm64)
        run: cargo test --locked --all-targets

      - name: Build arm64
        run: cargo build --locked --release --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --locked --release --target x86_64-apple-darwin

      - name: Engine self-test
        run: ./target/aarch64-apple-darwin/release/${{ env.BIN_NAME }} --selftest

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in arm64 x86_64; do
            if [ "$ARCH" = "arm64" ]; then TARGET=aarch64-apple-darwin; else TARGET=x86_64-apple-darwin; fi
            PKG="${BIN_NAME}-${VERSION}-macos-${ARCH}"
            mkdir -p "dist/${PKG}"
            cp "target/${TARGET}/release/${BIN_NAME}" "dist/${PKG}/"
            cp README.md LICENSE "dist/${PKG}/"
            tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
            shasum -a 256 "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-macos
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Replicant DAW ${TAG#v}" --generate-notes || true
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber; then
              gh release edit "$TAG" --draft=false --title "Replicant DAW ${TAG#v}" || true
              exit 0
            fi
            sleep 5
          done
          exit 1
