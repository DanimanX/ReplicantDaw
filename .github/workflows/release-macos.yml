name: Release · macOS

on:
  push:
    tags:
      - "[0-9]*"
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: replicant-daw

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Engine self-test
        run: ./target/release/${{ env.BIN_NAME }} --selftest

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="${BIN_NAME}-${VERSION}-macos-arm64"
          mkdir -p "dist/${PKG}"
          cp "target/release/${BIN_NAME}" "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          shasum -a 256 "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-macos-arm64
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Engine self-test
        run: ./target/release/${{ env.BIN_NAME }} --selftest

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="${BIN_NAME}-${VERSION}-macos-x86_64"
          mkdir -p "dist/${PKG}"
          cp "target/release/${BIN_NAME}" "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          shasum -a 256 "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-macos-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
