name: Release · Windows

on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: replicant-daw

jobs:
  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Engine self-test
        run: .\target\release\${{ env.BIN_NAME }}.exe --selftest

      - name: Package
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          $pkg = "$env:BIN_NAME-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item "target/release/$env:BIN_NAME.exe" "dist/$pkg/"
          Copy-Item README.md, LICENSE "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"
          Get-FileHash "dist/$pkg.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $pkg.zip" } |
            Out-File "dist/$pkg.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-windows-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Replicant DAW $tag" --generate-notes
          }
          for ($i = 0; $i -lt 5; $i++) {
            gh release upload $tag dist/* --clobber
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5
          }
          exit 1
