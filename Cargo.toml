[package]
name = "replicant-daw"
version = "1.3.1"
edition = "2021"
rust-version = "1.85"
description = "A cyberpunk DAW prototype: real-time FM synthesis and a neon interface."
license = "MIT"
default-run = "replicant-daw"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
cpal = "0.18"
rtrb = "0.4"
rustfft = "6.4"
# WAV / FLAC / MP3 decoding for the sample browser. Codec crates are pure Rust.
symphonia = { version = "0.6", default-features = false, features = ["wav", "flac", "mp3", "pcm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
midir = "0.11"
clack-host = "0.2"
clack-common = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "params", "state", "latency", "audio-ports", "note-ports", "gui", "thread-check", "timer", "posix-fd"] }
vst3-host = { version = "0.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# CLAP GUI embedding: the host creates a plain X11 window and hands its id to
# the plugin, which is the only mode CLAP plugins commonly implement.
xcb = "1.7"

[target.'cfg(unix)'.dependencies]
# Polling the file descriptors CLAP plugins register through
# `clap_host_posix_fd_support` (JUCE drives its editor from the X11 socket).
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
