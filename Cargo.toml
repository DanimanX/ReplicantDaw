[package]
name = "replicant-daw"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A cyberpunk DAW prototype: real-time FM synthesis and a neon interface."
license = "MIT"
default-run = "replicant-daw"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
cpal = "0.18"
rtrb = "0.4"
rustfft = "6.4"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
